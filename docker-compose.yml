version: '3.9'

services:
  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/padapav
      SPRING_DATASOURCE_USERNAME: padapav
      SPRING_DATASOURCE_PASSWORD: padapav
      SPRING_PROFILES_ACTIVE: docker
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VESRSION: "0"
    depends_on:
      postgres:
        condition: service_healthy

  customer-service:
    build:
      context: ./services/customer-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/padapav
      SPRING_DATASOURCE_USERNAME: padapav
      SPRING_DATASOURCE_PASSWORD: padapav
      SPRING_PROFILES_ACTIVE: docker
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "0"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/padapav
      SPRING_DATASOURCE_USERNAME: padapav
      SPRING_DATASOURCE_PASSWORD: padapav
      SPRING_PROFILES_ACTIVE: docker
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VESRSION: "0"
      APP_PAYMENT_SERVICE_URL: http://payment-service:8084
      APP_KITCHEN_SERVICE_URL: http://kitchen-service:8085
      APP_DELIVERY_SERVICE_URL: http://delivery-service:8086
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/padapav
      SPRING_DATASOURCE_USERNAME: padapav
      SPRING_DATASOURCE_PASSWORD: padapav
      SPRING_PROFILES_ACTIVE: docker
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "0"
    depends_on:
      postgres:
        condition: service_healthy

  kitchen-service:
    build:
      context: ./services/kitchen-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/padapav
      SPRING_DATASOURCE_USERNAME: padapav
      SPRING_DATASOURCE_PASSWORD: padapav
      SPRING_PROFILES_ACTIVE: docker
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "0"
    depends_on:
      postgres:
        condition: service_healthy

  delivery-service:
    build:
      context: ./services/delivery-service
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/padapav
      SPRING_DATASOURCE_USERNAME: padapav
      SPRING_DATASOURCE_PASSWORD: padapav
      SPRING_PROFILES_ACTIVE: docker
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "0"
    depends_on:
      postgres:
        condition: service_healthy

  search-service:
    build:
      context: ./services/search-service
      dockerfile: Dockerfile
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      opensearch:
        condition: service_started

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: docker

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      catalog-service:
        condition: service_started
      customer-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      kitchen-service:
        condition: service_started
      delivery-service:
        condition: service_started
      search-service:
        condition: service_started
      notification-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CATALOG_SERVICE_URL: http://catalog-service:8081
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      KITCHEN_SERVICE_URL: http://kitchen-service:8085
      DELIVERY_SERVICE_URL: http://delivery-service:8086
      SEARCH_SERVICE_URL: http://search-service:8087
      NOTIFICATION_SERVICE_URL: http://notification-service:8088

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: padapav
      POSTGRES_USER: padapav
      POSTGRES_PASSWORD: padapav
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padapav -d padapavb"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_SECURITY_PLUGIN=true"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  volumes:
  postgres_data:
  opensearch_data:
