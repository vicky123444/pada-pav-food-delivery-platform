name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  backend:
    name: Java 21 / Maven
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven tests
        run: mvn -B verify

  frontend:
    name: React / TypeScript build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [customer-web, restaurant-admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: apps/${{ matrix.app }}
        run: npm run build
