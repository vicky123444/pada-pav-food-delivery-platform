server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: catalog
          uri: ${CATALOG_SERVICE_URL:http://catalog-service:8081}
          predicates:
            - Path=/api/v1/menu/**
        - id: customer
          uri: ${CUSTOMER_SERVICE_URL:http://customer-service:8082}
          predicates:
            - Path=/api/v1/customers/**
        - id: order
          uri: ${ORDER_SERVICE_URL:http://order-service:8083}
          predicates:
            - Path=/api/v1/orders/**
        - id: payment
          uri: ${PAYMENT_SERVICE_URL:http://payment-service:8084}
          predicates:
            - Path=/api/v1/payments/**
        - id: kitchen
          uri: ${KITCHEN_SERVICE_URL:http://kitchen-service:8085}
          predicates:
            - Path=/api/v1/kitchen/**
        - id: delivery
          uri: ${DELIVERY_SERVICE_URL:http://delivery-service:8086}
          predicates:
            - Path=/api/v1/delivery/**
        - id: search
          uri: ${SEARCH_SERVICE_URL:http://search-service:8087}
          predicates:
            - Path=/api/v1/search/**
        - id: notification
          uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8088}
          predicates:
            - Path=/api/v1/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
